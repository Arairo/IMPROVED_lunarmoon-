name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Commits made by the data workflows don't trigger pushes, so redeploy after them.
  workflow_run:
    workflows: ["Build global terrain", "Validate against JPL Horizons", "Add 20 m terrain and check against NASA PGDA", "Check shadows against an LROC photo"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    # After a data workflow, only continue if it succeeded and ran on main.
    # A failed or cancelled upstream run (or one on another branch) must not deploy.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies (high or critical fails the build)
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Build for /<repository-name>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  browser:
    # Core journeys in a real browser (test/smoke-e2e.cjs) against the production build.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright and Chromium (test-only, not shipped)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          npx vite preview --port 4174 --strictPort &
          for i in $(seq 60); do curl -sf http://localhost:4174/ > /dev/null && break; sleep 1; done
          node test/smoke-e2e.cjs http://localhost:4174/

  deploy:
    # Pull requests are built and tested above but never published.
    # Manual runs are only allowed to publish from main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer push waits rather than cancelling a live deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
