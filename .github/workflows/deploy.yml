name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Commits made by the data workflows don't trigger pushes, so redeploy after them.
  workflow_run:
    workflows: ["Build global terrain", "Validate against JPL Horizons", "Add 20 m terrain and check against NASA PGDA", "Check shadows against an LROC photo"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    # After a data workflow, only continue if it succeeded and ran on main.
    # A failed or cancelled upstream run (or one on another branch) must not deploy.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The same base path GitHub Pages serves the site from, for the build AND the
      # browser test, so the test exercises exactly what is deployed.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies (high or critical fails the build)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies, build and test tools included (high or critical fails the build)
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build for /<repository-name>/
        run: npm run build
      - name: Install Playwright and Chromium (test-only, not shipped)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test of the built site, served under the Pages base path
        run: |
          npx vite preview --port 4174 --strictPort &
          for i in $(seq 60); do curl -sf "http://localhost:4174${BASE_PATH}" > /dev/null && break; sleep 1; done
          node test/smoke-e2e.cjs "http://localhost:4174${BASE_PATH}"
      # Uploaded only after the tests above passed on these same files.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Pull requests are built and tested above but never published.
    # Manual runs are only allowed to publish from main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer push waits rather than cancelling a live deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
