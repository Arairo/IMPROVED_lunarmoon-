name: Validate against JPL Horizons

# Run from the Actions tab ("Run workflow"). Compares the engine's Sun and
# Earth positions with NASA JPL Horizons, posts the scoreboard to the run
# summary, and saves it to public/data/validation.json so the app's
# "How we know it's right" panel shows the latest result. Deploy runs after it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare with JPL Horizons
        run: node tools/validate-horizons.mjs --json validation.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: horizons-validation
          path: validation.json
      - name: Save the scoreboard into the app
        run: |
          cp validation.json public/data/validation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data/validation.json
          git commit -m "Update JPL Horizons validation scoreboard" || echo "Nothing changed"
          git push
