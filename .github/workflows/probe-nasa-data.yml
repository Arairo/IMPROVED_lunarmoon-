name: Probe NASA data listings

# Maintenance helper: reads NASA pages and data listings so the data workflows
# can point at the right files (this project's dev sandbox can't reach them).
# Prints text, links and file headers to the job log. Changes nothing.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to read
        required: true
      mode:
        description: "text (page text), links (hrefs only), head (first bytes / GDAL info for data files)"
        default: text
      grep:
        description: Optional regex; only lines matching it are printed
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        if: inputs.mode == 'head'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - name: Read
        env:
          URLS: ${{ inputs.urls }}
          MODE: ${{ inputs.mode }}
          PATTERN: ${{ inputs.grep }}
        run: |
          for u in $URLS; do
            echo "=================== $u"
            case "$MODE" in
              links)
                curl -sL -m 90 -A "Mozilla/5.0" "$u" | grep -oiE '(href|src)="[^"]+"' | sed -E 's/^(href|src)="//; s/"$//' | sort -u > out.txt ;;
              head)
                curl -sIL -m 60 "$u" | grep -iE "^(HTTP|content-length|content-type|last-modified)" > out.txt
                gdalinfo -nomd "/vsicurl/$u" 2>&1 | head -60 >> out.txt || true ;;
              *)
                curl -sL -m 90 -A "Mozilla/5.0" "$u" | python3 -c '
          import sys, html, re
          t = sys.stdin.read()
          t = re.sub(r"(?is)<(script|style|noscript)[^>]*>.*?</\1>", " ", t)
          t = re.sub(r"(?i)<(br|p|div|li|tr|h[1-6]|table|section)[^>]*>", "\n", t)
          t = re.sub(r"(?i)<a [^>]*href=\"([^\"]+)\"[^>]*>", r" [\1] ", t)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          for line in t.splitlines():
              line = " ".join(line.split())
              if line: print(line)
          ' > out.txt ;;
            esac
            if [ -n "$PATTERN" ]; then grep -iE "$PATTERN" out.txt | head -400; else head -400 out.txt; fi
          done
