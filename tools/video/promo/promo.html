<body>
<canvas id="stars" width="1920" height="1080"></canvas>
<div id="root"></div>
<div class="vign"></div>

<div class="si">SI-assisted · real screen captures · music generated in code</div>
<script>
const A = (n) => `../cap/${n}`;
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);

const root = document.getElementById('root');

(() => {

})();


const CUT = location.hash === '#short' ? 'short' : 'full';
const T = {};
const PLAN = CUT === 'full'
  ? [['hook', 0, 4.6], ['need', 4.4, 10.6], ['pick', 10.4, 16.2], ['layers', 16, 24.2], ['check', 24, 30.2], ['fly', 30, 38.2], ['trust', 38, 46.2], ['modes', 46, 52.4], ['end', 52.2, 60]]

const DURATION = PLAN[PLAN.length - 1][2];
window.T = T; window.CUES = PLAN.map((p) => p[1]);
// ---------- building blocks ----------
function placeWin(w, p) {
  const s = p.s, px = p.cx * 1600, py = p.cy * 1000;
  w.style.transform = `translate(${W / 2 + (p.dx || 0)}px, ${H / 2 + (p.dy || 0)}px) rotateX(${p.rx || 0}deg) rotateY(${p.ry || 0}deg) scale(${s}) translate(${-px}px, ${-py}px)`;

}

function kicker(n, h, sub) { return el(`<div class="kick"><div class="scrim" style="left:-110px;top:-700px;bottom:-700px;position:absolute;z-index:-1"></div><span class="n">${n}</span><div><div class="h grad">${h}</div><div class="s">${sub}</div></div></div>`); }

  k.style.opacity = a * (1 - b); k.style.transform = `translateX(${(1 - a) * -40}px)`; k.style.filter = `blur(${(1 - a) * 10 + b * 8}px)`;

const S = [];
const CUR_SVG = '<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L16 21l-3 1.5-3-7.5-6 5z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>';

/**
 * Generic app-window scene.
 * cfg: { id, imgs:[name...], swaps:[[u, index]], cam:[[u,{...}]], kick:[n,h,sub], callouts:[[u0,u1,[x0,y0,x1,y1],label]], click:{at:u, x, y}, frames }
 */
function winScene(cfg) {

  const st = el('<div class="stage"></div>');
  const w = el('<div class="win"></div>');

  const k = cfg.kick ? kicker(...cfg.kick) : null; if (k) root.appendChild(k);

  let cur, rip; if (cfg.click) { cur = el(CUR_SVG); rip = el('<div class="ripple"></div>'); root.appendChild(rip); root.appendChild(cur); }

    const on = t >= a && t < b + 0.01;

    if (!on) return;
    const u = (t - a) / len;
    const p = kf(u, cfg.cam);
    p.o = Math.min(p.o ?? 1, prog(t, a, a + 0.45), 1 - prog(t, b - 0.4, b));

    if (k) animKicker(k, t, a + 0.3, b - 0.05);
    calls.forEach((d, i) => {
      const [u0, u1, r] = cfg.callouts[i];
      const [x0, y0] = toScreen(p, r[0], r[1]), [x1, y1] = toScreen(p, r[2], r[3]);

      d.style.opacity = (kin * (1 - kout) * (p.o ?? 1)).toFixed(3); d.style.transform = `scale(${lerp(1.06, 1, kin)})`;
    });
    if (cfg.click) {
      const c = cfg.click; const [tx, ty] = toScreen(p, c.x, c.y);
      const km = ease(prog(u, c.at - 0.14, c.at));
      cur.style.left = `${lerp(W - 260, tx, km)}px`; cur.style.top = `${lerp(H - 220, ty, km)}px`;
      cur.style.opacity = prog(u, c.at - 0.2, c.at - 0.14) * (1 - prog(u, 0.93, 0.99));
      const kr = prog(u, c.at, c.at + 0.08); rip.style.left = `${tx + 6}px`; rip.style.top = `${ty + 6}px`; rip.style.opacity = u > c.at ? 1 - kr : 0; rip.style.transform = `scale(${0.3 + kr * 1.2})`;
    }
  });
}


function big(text, a, b, top = 820, cls = '') {
  const d = el(`<div class="big grad ${cls}" style="top:${top}px">${text}</div>`); root.appendChild(d);
  S.push((t) => { const on = t > a - 0.1 && t < b + 0.1; show(d, on); if (!on) return; const k = out(prog(t, a, a + 0.55)), q = prog(t, b - 0.35, b); d.style.opacity = k * (1 - q); d.style.transform = `translateY(${(1 - k) * 26}px) scale(${lerp(1.04, 1, k)})`; d.style.filter = `blur(${(1 - k) * 10 + q * 8}px)`; });
}
function scrim(a, b) { const d = el('<div class="bscrim"></div>'); root.appendChild(d); S.push((t) => { const on = t > a && t < b; show(d, on); if (on) d.style.opacity = Math.min(prog(t, a, a + .4), 1 - prog(t, b - .4, b)); }); }
const has = (id) => !!T[id];
// Hook: the landing page's sunrise
if (has('hook')) {
  const sc = T.hook; const g = el('<div class="layer"></div>');
  const ims = ['land0','land1','land2','land3','land4','land5','land6','land7'].map((n) => { const i = el(`<img class="full" src="${A(n + '.png')}" style="transform-origin:50% 22%">`); g.appendChild(i); return i; });
  root.appendChild(g);
  S.push((t) => { const end = sc.end + 0.35; const on = t < end; show(g, on); if (!on) return;
    const f = clamp(t / 3.6) * (ims.length - 1), i = Math.floor(f), fr = f - i;
    ims.forEach((im, j) => { im.style.opacity = j <= i ? 1 : j === i + 1 ? fr : 0; im.style.transform = `scale(${lerp(3.0, 2.7, t / end)})`; });
    g.style.opacity = 1 - prog(t, sc.end - 0.3, end); });
  scrim(0.6, T.hook.end + 0.3); big('At the Moon’s south pole,<br>the Sun barely rises.', 0.9, T.hook.end + 0.2, 760);
}
if (has('need')) {
  winScene({ id: 'need', imgs: ['globe_site.png'], cam: [[0, { cx: .6, cy: .5, s: 1.4 }], [0.55, { cx: .61, cy: .5, s: 2.6 }], [1, { cx: .61, cy: .3, s: 2.8 }]],
    callouts: [[0.1, 0.5, [.24, .79, .365, .82], 'Sun · Earth'], [0.6, 0.98, [.505, .105, .725, .142], 'Right now']] });
  const a = T.need.start; scrim(a, T.need.end + .3);
  big('A lander needs sunlight for power.', a + 0.3, a + 3.0, 840, 'sm'); big('And Earth in view to call home.', a + 3.1, T.need.end + 0.2, 840, 'sm');
}
if (has('pick')) {
  winScene({ id: 'pick', imgs: ['site.png', 'date_cal.png'], swaps: [[0.5, 1]], cam: [[0, { cx: .5, cy: .5, s: .8, rx: 14, ry: -12 }], [0.25, { cx: .118, cy: .35, s: 1.9, dx: -330 }], [0.5, { cx: .118, cy: .38, s: 1.95, dx: -330 }], [0.58, { cx: .118, cy: .45, s: 1.9, dx: -330 }], [1, { cx: .118, cy: .47, s: 1.95, dx: -330 }]] });
  const a = T.pick.start; const d1 = el('<div class="big grad" style="top:420px;left:1120px;right:60px;text-align:left;padding:0">Pick a site.</div>'), d2 = el('<div class="big grad" style="top:520px;left:1120px;right:60px;text-align:left;padding:0">Pick a date.</div>');
  root.appendChild(d1); root.appendChild(d2);
  S.push((t) => { [[d1, a + .6], [d2, a + 3.0]].forEach(([d, s]) => { const on = t > s - .1 && t < T.pick.end + .2; show(d, on); if (on) { const k = out(prog(t, s, s + .5)); d.style.opacity = k * (1 - prog(t, T.pick.end - .3, T.pick.end)); d.style.transform = `translateX(${(1 - k) * 40}px)`; } }); });
}
if (has('layers')) {
  const L = CUT === 'full' ? ['layer_sun_year.png', 'layer_earth.png', 'layer_both.png', 'polar_sun.png', 'layer_height.png', 'layer_slope.png'] : ['layer_sun_year.png', 'layer_earth.png', 'layer_both.png', 'layer_slope.png'];
  winScene({ id: 'layers', imgs: L, swaps: L.slice(1).map((_, i) => [(i + 1) / L.length, i + 1]), cam: [[0, { cx: .6, cy: .47, s: 1.25 }], [1, { cx: .6, cy: .47, s: 1.5 }]] });
  scrim(T.layers.start, T.layers.end + .3); big('See the whole pole at once.', T.layers.start + .5, T.layers.end + .2, 860);
}
if (has('check')) {
  winScene({ id: 'check', imgs: ['check.png'], cam: [[0, { cx: .5, cy: .5, s: .9 }], [0.2, { cx: .118, cy: .28, s: 2.4, dx: 360 }], [0.55, { cx: .118, cy: .3, s: 2.4, dx: 360 }], [0.7, { cx: .118, cy: .66, s: 2.4, dx: 360 }], [1, { cx: .118, cy: .67, s: 2.5, dx: 360 }]],
    callouts: [[0.72, 0.99, [.005, .625, .225, .722], 'Close to the line']] });
  const a = T.check.start; const d1 = el('<div class="big grad" style="top:430px;left:80px;right:1000px;text-align:left;padding:0">A clear answer.</div>'), d2 = el('<div class="big grad" style="top:530px;left:80px;right:1000px;text-align:left;padding:0">And an honest one.</div>');
  root.appendChild(d1); root.appendChild(d2);
  S.push((t) => { [[d1, a + .7], [d2, a + 3.2]].forEach(([d, s]) => { const on = t > s - .1 && t < T.check.end + .2; show(d, on); if (on) { const k = out(prog(t, s, s + .5)); d.style.opacity = k * (1 - prog(t, T.check.end - .3, T.check.end)); d.style.transform = `translateX(${(1 - k) * -40}px)`; } }); });
}
if (has('fly')) {
  winScene({ id: 'fly', imgs: ['flight0.png', 'flight2.png', 'flight3.png', 'terrain0.png', 'terrain1.png'], swaps: [[0.18, 1], [0.34, 2], [0.5, 3], [0.75, 4]],
    cam: [[0, { cx: .66, cy: .42, s: 1.3 }], [0.48, { cx: .66, cy: .42, s: 1.45 }], [0.52, { cx: .42, cy: .45, s: 1.45 }], [1, { cx: .42, cy: .45, s: 1.6 }]] });
  scrim(T.fly.start, T.fly.end + .3); big('From launch to touchdown,<br>on real NASA terrain.', T.fly.start + .5, T.fly.end + .2, 790, 'sm');
}
if (has('trust')) {
  winScene({ id: 'trust', imgs: ['trust.png'], cam: [[0, { cx: .75, cy: .6, s: 1.6, o: .14 }], [1, { cx: .75, cy: .62, s: 1.7, o: .14 }]] });
  const a = T.trust.start, b = T.trust.end;
  const st = [['154', 'checks against NASA JPL Horizons. Worst: 0.007°', 180], ['93.5%', 'of pixels agree with Lunar Reconnaissance Orbiter photos', 716], ['38', 'sites on NASA LOLA terrain, 20 m at Artemis III regions', 1252]].map(([n, s, x], i) => { const d = el(`<div class="stat" style="left:${x}px;top:330px"><b>${n}</b><span>${s}</span></div>`); root.appendChild(d); return [d, a + 0.5 + i * (CUT === 'full' ? 1.2 : 0.8)]; });
  S.push((t) => st.forEach(([d, s]) => { const on = t > s - .1 && t < b + .3; show(d, on); if (on) { const k = out(prog(t, s, s + .6)); d.style.opacity = k * (1 - prog(t, b - .3, b + .2)); d.style.transform = `translateY(${(1 - k) * 40}px)`; } }));
  big('Checked against NASA data.', a + (CUT === 'full' ? 4.2 : 3.0), b + .2, 760, 'sm');
}
if (has('modes')) {
  const sc = T.modes; const g = el('<div class="layer"></div>'); root.appendChild(g);
  const w1 = el(`<div class="win"><img src="${A('beg1.png')}"></div>`), w2 = el(`<div class="win"><img src="${A('check.png')}"></div>`);
  const ph = el(`<div class="phone"><img src="${A('phone_check.png')}"></div>`);
  const st = el('<div class="stage"></div>'); st.appendChild(w1); st.appendChild(w2); g.appendChild(st); g.appendChild(ph);
  const l1 = el('<div class="big sm grad" style="top:120px">For first-timers and mission planners.</div>'), l2 = el('<div class="big sm grad" style="top:880px">On any screen.</div>'); g.appendChild(l1); g.appendChild(l2);
