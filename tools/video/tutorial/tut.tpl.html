<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased; }
  #stars { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; }
  .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 45%; }
  .win { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; border-radius: 18px; overflow: hidden;
    box-shadow: 0 60px 140px rgba(0,0,0,.65), 0 20px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); background: #0b0f17; }
  .win img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .txt { position: absolute; left: 0; right: 0; text-align: center; }
  .w { display: inline-block; }
  .grad, .grad .w { background: linear-gradient(180deg, #ffffff 30%, #a9b0c2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kick { position: absolute; left: 110px; top: 50%; width: 520px; margin-top: -170px; display: flex; flex-direction: column; align-items: flex-start; gap: 20px; z-index: 6; }
  .kick .n { font: 800 28px 'Inter'; color: #2997ff; padding: 6px 14px; border-radius: 12px; background: rgba(41,151,255,.14); }
  .kick .h { font: 800 72px 'Inter'; letter-spacing: -0.035em; line-height: 1.02; padding-bottom: .06em; }
  .kick .s { font: 500 27px/1.4 'Inter'; color: #a1a6b3; margin-top: 12px; }
  .scrim { position: absolute; left: 0; top: 0; bottom: 0; width: 900px; background: linear-gradient(90deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.72) 48%, transparent 100%); z-index: 5; }
  .callout { position: absolute; border-radius: 18px; border: 3px solid #2997ff; box-shadow: 0 0 0 6px rgba(41,151,255,.18), 0 0 40px rgba(41,151,255,.55); z-index: 20; pointer-events: none; }
  .callout b { position: absolute; left: -3px; top: -46px; padding: 6px 14px; border-radius: 10px; background: #2997ff; color: #fff; font: 700 22px 'Inter'; white-space: nowrap; }
  .cursor { position: absolute; width: 36px; height: 36px; z-index: 50; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .ripple { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); z-index: 49; }
  .cap { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); max-width: 1500px; padding: 16px 28px; border-radius: 22px; background: rgba(12,14,20,.78); backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 50px rgba(0,0,0,.5); font: 600 34px/1.3 'Inter'; letter-spacing: -0.01em; text-align: center; z-index: 80; white-space: nowrap; }
  .chip { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); padding: 10px 20px; border-radius: 999px; background: rgba(12,14,20,.7); border: 1px solid rgba(255,255,255,.14); font: 700 22px 'Inter'; z-index: 70; backdrop-filter: blur(16px); }
  .vign { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.5) 100%); z-index: 60; }
  .si { position: absolute; right: 26px; top: 20px; font: 500 15px 'Inter'; color: rgba(255,255,255,.42); z-index: 99; }
  .logo { width: 96px; height: 96px; border-radius: 24px; background: #0b0f17; display: grid; place-items: center; box-shadow: 0 20px 50px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.12); margin: 0 auto 26px; }
  .url { display: inline-block; margin-top: 30px; padding: 14px 28px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); font: 600 28px 'Inter'; color: #fff; }

  .chbar { position: absolute; left: 60px; right: 60px; top: 26px; height: 4px; display: flex; gap: 6px; z-index: 90; }
  .chbar i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); overflow: hidden; position: relative; }
  .chbar i b { position: absolute; inset: 0; width: 0; background: linear-gradient(90deg, #2997ff, #64d2ff); }
  .chlab { position: absolute; left: 60px; top: 44px; z-index: 90; display: flex; align-items: center; gap: 12px; font: 600 21px 'Inter'; color: rgba(255,255,255,.92); letter-spacing: -0.01em; }
  .chlab .no { font: 700 15px 'Inter'; color: #64d2ff; letter-spacing: .12em; text-transform: uppercase; }
  .si { top: 44px; }
</style></head>
<body>
<canvas id="stars" width="1920" height="1080"></canvas>
<div id="root"></div>
<div class="vign"></div>
<div class="cap" id="cap" style="opacity:0"></div>
<div class="chbar" id="chbar"></div><div class="chlab" id="chlab"><span class="no"></span><span class="nm"></span></div>
<div class="si">SI-assisted · AI narration (Kokoro TTS) · real screen captures</div>
<script>
const LINES = __LINES__;
const A = (n) => `../cap/${n}`;
const CH = __CH__;
const R = __RECTS__;
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const out = (k) => 1 - Math.pow(1 - k, 3);
const prog = (t, a, b) => clamp((t - a) / (b - a));
function kf(u, frames) {
  if (u <= frames[0][0]) return { ...frames[0][1] };
  for (let i = 0; i < frames.length - 1; i++) {
    const [t0, p0] = frames[i], [t1, p1] = frames[i + 1];
    if (u <= t1) { const k = ease((u - t0) / (t1 - t0)); const o = {}; for (const key in p0) o[key] = lerp(p0[key], p1[key] ?? p0[key], k); return o; }
  }
  return { ...frames[frames.length - 1][1] };
}
const root = document.getElementById('root');
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
(() => {
  const c = document.getElementById('stars').getContext('2d'); const r = (a, b) => a + Math.random() * (b - a);
  const g = c.createRadialGradient(W * .5, H * .55, 0, W * .5, H * .55, W * .7); g.addColorStop(0, '#0b1020'); g.addColorStop(1, '#000'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 1500; i++) { c.fillStyle = `rgba(255,255,255,${r(.08, .55)})`; c.beginPath(); c.arc(r(0, W), r(0, H), r(.3, 1.1), 0, 7); c.fill(); }
})();

// ---------- timeline from the narration ----------
const LEAD = 1.2, GAP = 0.65, TAIL = 4.2;
let t0 = LEAD; const T = {};
LINES.forEach((l, i) => { T[l.id] = { start: t0 - (i === 0 ? LEAD : 0.35), voice: t0, end: t0 + l.dur + GAP, dur: l.dur, text: l.text }; t0 += l.dur + GAP; });
T.outro.end += TAIL;
const DURATION = T.outro.end;

// Caption chunks: split at sentence and clause breaks, max ~11 words, timed by length.
const CAPS = [];
LINES.forEach((l) => {
  const parts = l.text.replace(/([.!?:,])\s+/g, '$1|').split('|');
  const chunks = [];
  for (const p of parts) {
    const words = p.split(' ');
    if (chunks.length && (chunks[chunks.length - 1] + ' ' + p).split(' ').length <= 9 && !/[.!?:]$/.test(chunks[chunks.length - 1])) chunks[chunks.length - 1] += ' ' + p;
    else if (words.length > 12) { const h = Math.ceil(words.length / 2); chunks.push(words.slice(0, h).join(' '), words.slice(h).join(' ')); }
    else chunks.push(p);
  }
  const total = chunks.reduce((a, c) => a + c.length + 6, 0);
  let s = T[l.id].voice;
  chunks.forEach((c) => { const d = (l.dur * (c.length + 6)) / total; CAPS.push({ s, e: s + d, text: c }); s += d; });
});
window.CAPS = CAPS; window.T = T;

// ---------- building blocks ----------
function placeWin(w, p) {
  const s = p.s, px = p.cx * 1600, py = p.cy * 1000;
  w.style.transform = `translate(${W / 2 + (p.dx || 0)}px, ${H / 2 + (p.dy || 0)}px) rotateX(${p.rx || 0}deg) rotateY(${p.ry || 0}deg) scale(${s}) translate(${-px}px, ${-py}px)`;
  w.style.opacity = p.o ?? 1;
}
const toScreen = (p, x, y) => [W / 2 + (p.dx || 0) + (x - p.cx) * 1600 * p.s, H / 2 + (p.dy || 0) + (y - p.cy) * 1000 * p.s];
function kicker(n, h, sub) { return el(`<div class="kick"><div class="scrim" style="left:-110px;top:-700px;bottom:-700px;position:absolute;z-index:-1"></div><span class="n">${n}</span><div><div class="h grad">${h}</div><div class="s">${sub}</div></div></div>`); }
function animKicker(k, t, tin, tout) {
  const a = out(prog(t, tin, tin + 0.6)), b = ease(prog(t, tout - 0.45, tout));
  k.style.opacity = a * (1 - b); k.style.transform = `translateX(${(1 - a) * -40}px)`; k.style.filter = `blur(${(1 - a) * 10 + b * 8}px)`;
}
const show = (n, on) => { n.style.display = on ? '' : 'none'; };
const S = [];
const CUR_SVG = '<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L16 21l-3 1.5-3-7.5-6 5z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>';

/**
 * Generic app-window scene.
 * cfg: { id, imgs:[name...], swaps:[[u, index]], cam:[[u,{...}]], kick:[n,h,sub], callouts:[[u0,u1,[x0,y0,x1,y1],label]], click:{at:u, x, y}, frames }
 */
function winScene(cfg) {
  const sc = T[cfg.id];
  const st = el('<div class="stage"></div>');
  const w = el('<div class="win"></div>');
  const ims = cfg.imgs.map((n, i) => { const im = el(`<img src="${A(n)}">`); im.style.opacity = i === 0 ? 1 : 0; w.appendChild(im); return im; });
  st.appendChild(w); root.appendChild(st);
  const k = cfg.kick ? kicker(...cfg.kick) : null; if (k) root.appendChild(k);
  const calls = (cfg.callouts || []).map((c) => { const d = el(`<div class="callout">${c[3] ? `<b>${c[3]}</b>` : ''}</div>`); root.appendChild(d); return d; });
  let cur, rip; if (cfg.click) { cur = el(CUR_SVG); rip = el('<div class="ripple"></div>'); root.appendChild(rip); root.appendChild(cur); }
  const a = sc.start, b = sc.end + 0.35, len = b - a;
  (window.SC ||= []).push({ id: cfg.id, a, b, callouts: cfg.callouts || [], imgs: cfg.imgs, swaps: cfg.swaps || [], click: cfg.click || null });
  S.push((t) => {
    const on = t >= a && t < b + 0.01;
    [st, k, cur, rip, ...calls].forEach((n) => n && show(n, on));
    if (!on) return;
    const u = (t - a) / len;
    const p = kf(u, cfg.cam);
    p.o = Math.min(p.o ?? 1, prog(t, a, a + 0.45), 1 - prog(t, b - 0.4, b));
    placeWin(w, p);
    // image swaps (fade 0.25 s) and optional flipbook
    if (cfg.swaps) { let idx = 0; cfg.swaps.forEach(([su, i]) => { if (u >= su) idx = i; }); ims.forEach((im, i) => { const sw = cfg.swaps.find((x) => x[1] === i); const tin = sw ? a + sw[0] * len : a; im.style.opacity = i === 0 ? 1 : i <= idx ? prog(t, tin, tin + 0.25) : 0; }); }
    if (cfg.frames) { const f = clamp((u - cfg.frames.u0) / (cfg.frames.u1 - cfg.frames.u0)) * (ims.length - 2) + 1; const i = Math.floor(f), fr = f - i; ims.forEach((im, j) => { im.style.opacity = j === 0 ? 1 : u < cfg.frames.u0 ? 0 : j === i ? 1 : j === i + 1 ? fr : 0; }); }
    if (k) animKicker(k, t, a + 0.3, cfg.kickEnd ?? (b - 0.05));
    calls.forEach((d, i) => {
      const [u0, u1, r] = cfg.callouts[i];
      const [x0, y0] = toScreen(p, r[0], r[1]), [x1, y1] = toScreen(p, r[2], r[3]);
      const kin = out(prog(t, a + u0 * len, a + u0 * len + 0.35)), kout = prog(t, a + u1 * len - 0.3, a + u1 * len);
      d.style.left = `${x0 - 8}px`; d.style.top = `${y0 - 8}px`; d.style.width = `${x1 - x0 + 16}px`; d.style.height = `${y1 - y0 + 16}px`;
      d.style.opacity = (kin * (1 - kout) * (p.o ?? 1)).toFixed(3); d.style.transform = `scale(${lerp(1.06, 1, kin)})`;
    });
    if (cfg.click) {
      const c = cfg.click; const [tx, ty] = toScreen(p, c.x, c.y); const ta = a + c.at * len;
      const km = ease(prog(t, ta - 0.9, ta));
      cur.style.left = `${lerp(W - 260, tx, km)}px`; cur.style.top = `${lerp(H - 220, ty, km)}px`;
      cur.style.opacity = prog(t, ta - 1.1, ta - 0.9) * (1 - prog(t, ta + 1.0, ta + 1.4));
      const kr = prog(t, ta, ta + 0.5); rip.style.left = `${tx + 6}px`; rip.style.top = `${ty + 6}px`; rip.style.opacity = t > ta ? 1 - kr : 0; rip.style.transform = `scale(${0.3 + kr * 1.2})`;
    }
  });
}

// ---------- scenes ----------
// Intro: the landing page's sunrise, with the title
{
  const sc = T.intro; const g = el('<div class="layer"></div>');
  const ims = ['land1','land2','land3','land4','land5','land6','land7','land_end'].map((n) => { const i = el(`<img class="full" src="${A(n + '.png')}">`); g.appendChild(i); return i; });
  const kick = el('<div class="txt" style="top:430px;font:700 22px Inter;letter-spacing:.18em;text-transform:uppercase;color:#ffb300">Tutorial</div>');
  const ttl = el('<div class="txt grad" style="top:468px;font:800 104px Inter;letter-spacing:-0.035em">Professional mode</div>');
  const sub = el('<div class="txt" style="top:604px;font:500 30px Inter;color:#c7c9d1">Every feature, one chapter at a time</div>');
  const scr = el('<div class="layer" style="background:rgba(0,0,0,.8);backdrop-filter:blur(18px)"></div>');
  g.appendChild(scr); [kick, ttl, sub].forEach((n) => g.appendChild(n)); root.appendChild(g);
  S.push((t) => {
    const end = sc.end + 0.4; const on = t < end; show(g, on); if (!on) return;
    const f = clamp(t / 5.5) * (ims.length - 1), i = Math.floor(f), fr = f - i;
    ims.forEach((im, j) => { im.style.opacity = j === 0 ? 1 : j <= i ? 1 : j === i + 1 ? fr : 0; im.style.transform = `scale(${lerp(1.0, 1.08, t / end)})`; });
    const k1 = out(prog(t, 4.6, 5.8)); ttl.style.opacity = k1; ttl.style.filter = `blur(${(1 - k1) * 14}px)`; ttl.style.transform = `scale(${lerp(1.08, 1, k1)})`;
    kick.style.opacity = out(prog(t, 4.2, 5.0)); sub.style.opacity = out(prog(t, 5.4, 6.4)); scr.style.opacity = out(prog(t, 3.8, 5.0));
    g.style.opacity = 1 - prog(t, sc.end - 0.3, end);
  });
}
// ---- Beat-driven scenes -------------------------------------------------------------
// Each scene is a list of beats. A beat starts when the narrator says its phrase (or at
// the scene start), switches to its screenshot, moves the camera to frame its focus, and
// draws its highlight box. Boxes come from rects.json, measured on the real page during
// capture, so they sit exactly on the element being described.
const U = (...rs) => [Math.min(...rs.map((r) => r[0])), Math.min(...rs.map((r) => r[1])), Math.max(...rs.map((r) => r[2])), Math.max(...rs.map((r) => r[3]))];
const pad = (r, x = 0.006, y = 0.006) => [r[0] - x, r[1] - y, r[2] + x, r[3] + y];
const rr = (shot, key) => { const v = R[shot]?.[key]; if (!v) throw new Error(`no rect ${shot}.${key}`); return v; };
/** When the narrator reaches `phrase` in line `id` (characters spoken at an even rate, as the captions). */
function WD(id, phrase) {
  const l = LINES.find((x) => x.id === id); const i = l.text.indexOf(phrase);
  if (i < 0) throw new Error(`phrase not in ${id}: ${phrase}`);
  return T[id].voice + (l.dur * i) / l.text.length;
}
/** Camera that frames rect r in the free part of the screen (right of the title while it shows). */
function focus(r, { side = false, maxS = 2.3, minS = 0.62, fill = 0.78 } = {}) {
  const x0 = side ? 700 : 40, x1 = 1880, y0 = 96, y1 = 930;
  const w = (r[2] - r[0]) * 1600, h = (r[3] - r[1]) * 1000;
  const s = Math.max(minS, Math.min(maxS, (fill * (x1 - x0)) / w, (fill * (y1 - y0)) / h));
  return { cx: (r[0] + r[2]) / 2, cy: (r[1] + r[3]) / 2, s, dx: (x0 + x1) / 2 - 960, dy: (y0 + y1) / 2 - 540 };
}
const FULLR = [0, 0, 1, 1];
/** The left panel around a box, about h tall (readable zoom). */
const near = (box, h = 0.4) => { const c = (box[1] + box[3]) / 2, hh = Math.max(h, box[3] - box[1] + 0.06) / 2; return [0, Math.max(0.03, c - hh), 0.2325, Math.min(1, c + hh)]; };
/**
 * beats: [{ at: phrase | null, img, focus: rect | cam, box: rect, label, click: true, side }]
 * side: frame to the right of the chapter title (default: while the title shows).
 */
function beatScene(id, { kick, beats, move = 0.85 }) {
  const sc = T[id]; const a = sc.start, b = sc.end + 0.35, len = b - a;
  const times = beats.map((bt, i) => (i === 0 || bt.at == null ? a : Math.max(a + 0.2, WD(id, bt.at) - 0.2)));
  const kickEnd = kick ? (beats.length > 1 ? times[1] + 0.2 : b - 0.05) : undefined;
  const cams = beats.map((bt, i) => {
    const side = bt.side ?? (kick && times[i] < kickEnd - 0.1);
    if (bt.cam) return bt.cam;
    return focus(bt.focus || bt.box || FULLR, { side, ...(bt.fit || {}) });
  });
  const cam = [[0, cams[0]]];
  for (let i = 1; i < beats.length; i++) {
    const gap = (i + 1 < beats.length ? times[i + 1] : b) - times[i];
    const m = Math.min(move, gap * 0.6);
    cam.push([(times[i] - a) / len, cams[i - 1]], [(times[i] + m - a) / len, cams[i]]);
  }
  const last = cams[cams.length - 1]; cam.push([1, { ...last, s: last.s * 1.03 }]);
  // images: one per run of beats with the same screenshot
  const imgs = [], swaps = [];
  beats.forEach((bt, i) => { if (!imgs.length || bt.img !== imgs[imgs.length - 1]) { if (imgs.length) swaps.push([(times[i] + 0.1 - a) / len, imgs.length]); imgs.push(bt.img); } });
  const callouts = [];
  beats.forEach((bt, i) => {
    if (!bt.box) return;
    const end = i + 1 < beats.length ? times[i + 1] : b - 0.1;
    const arrive = Math.min(times[i] + (i === 0 ? 0.4 : Math.min(move, (end - times[i]) * 0.6)), end - 0.4);
    callouts.push([(arrive - a) / len, (end - a) / len, pad(bt.box), bt.label || '']);
  });
  const ci = beats.findIndex((bt) => bt.click);
  const click = ci >= 0 ? { at: (Math.min(times[ci] + 0.9, (ci + 1 < beats.length ? times[ci + 1] : b) - 0.3) - a) / len, x: beats[ci].clickAt ? beats[ci].clickAt[0] : (beats[ci].box[0] + beats[ci].box[2]) / 2, y: beats[ci].clickAt ? beats[ci].clickAt[1] : (beats[ci].box[1] + beats[ci].box[3]) / 2 } : null;
  winScene({ id, imgs: imgs.map((n) => n + '.png'), swaps, cam, callouts, kick, kickEnd, click });
}

beatScene('screen', { beats: [
  { img: 'site', cam: { cx: .5, cy: .5, s: .92, dy: 10 } },
  { at: 'mission flow', img: 'site', focus: U(rr('site', 'steps'), rr('site', 'best'), rr('site', 'search')), box: rr('site', 'steps'), label: 'Mission flow: five steps' },
  { at: 'The Moon sits', img: 'site', focus: rr('site', 'globe'), box: rr('site', 'globe'), label: 'The Moon' },
  { at: 'The pill', img: 'site', focus: pad(rr('site', 'pill'), 0.12, 0.08), box: rr('site', 'pill'), label: 'Right now' },
  { at: 'the timeline below', img: 'site', focus: rr('site', 'timeline'), box: rr('site', 'timeline'), label: 'The next 30 days' },
] });
const RAILTOP = [0, 0.05, 0.2325, 0.55];
beatScene('site', { kick: ['01', 'Site', 'Search, filter, type coordinates, or take a best spot.'], beats: [
  { img: 'site', focus: RAILTOP },
  { at: 'Search by name', img: 'site_search', focus: near(rr('site_search', 'search'), 0.34), box: rr('site_search', 'search'), label: 'Search' },
  { at: 'filter by mission', img: 'site', focus: near(rr('site', 'chips'), 0.34), box: rr('site', 'chips'), label: 'Filter by mission' },
  { at: 'type coordinates', img: 'site_coords', focus: near(rr('site_coords', 'coords'), 0.34), box: [0.0088, rr('site_coords', 'coords')[1], 0.2231, rr('site_coords', 'search')[1] - 0.006], label: 'Coordinates' },
  { at: 'best spots', img: 'site', focus: near(rr('site', 'best'), 0.34), box: rr('site', 'best'), label: 'Best spots this month' },
  { at: 'Every listed site', img: 'site', focus: [0.5, 0.38, 0.86, 0.74], box: [0.555, 0.44, 0.8, 0.7], label: 'Sites and Artemis III regions' },
] });
const SITE = [0.588, 0.49, 0.645, 0.545];
beatScene('rays', { beats: [
  { img: 'site', focus: [0.36, 0.42, 0.84, 0.84], box: SITE, label: 'Your site' },
